version: '3.8'
services:
  app-db:
    image: postgres:13
    environment:
      POSTGRES_DB: frequent_flier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - appdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  flight-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://app-db:5432/frequent_flier
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    depends_on:
      - app-db
    ports:
      - "8082:8080"

volumes:
  appdata: