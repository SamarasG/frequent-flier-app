version: '3.8'
services:
  database:
    build: .
    container_name: frequent_flier_db
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frequent_flier
    volumes:
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080