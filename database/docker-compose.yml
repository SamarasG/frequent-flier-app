version: '3.8'
services:
  database:
    build: .
    container_name: frequent_flier_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frequent_flier
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data: