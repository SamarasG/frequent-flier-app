# --- Database ---
quarkus.datasource.db-kind=postgresql
# docker setup
# quarkus.datasource.jdbc.url=jdbc:postgresql://frequent_flier_db:5432/frequent_flier
# k8s setup
quarkus.datasource.jdbc.url=jdbc:postgresql://frequent-flier-db:5432/frequent_flier

quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# --- Connection Pool ---
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.idle-timeout=30
quarkus.datasource.jdbc.max-lifetime=1800
quarkus.datasource.jdbc.acquisition-timeout=20

# Enable health check endpoints
quarkus.smallrye-health.root-path=/q/health
quarkus.datasource.health.enabled=true