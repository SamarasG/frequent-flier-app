version: '3.8'
services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://frequent_flier_db:5432/frequent_flier
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    depends_on:
      - frequent_flier_db
    ports:
      - "8082:8080"